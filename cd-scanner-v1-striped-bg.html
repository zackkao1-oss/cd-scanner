<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrooveRunner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'PingFang TC', 'Heiti TC', sans-serif;
            background: 
                repeating-linear-gradient(
                    45deg,
                    #0f0f0f,
                    #0f0f0f 8px,
                    #1a1a1a 8px,
                    #1a1a1a 9px
                );
            min-height: 100vh;
            color: #e5e5e5;
            padding: 16px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
        }
        .header-subtitle { margin-left: auto; font-size: 12px; color: #888; }
        .token-section {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
            display: none;
        }
        .token-section.active {
            display: block;
        }
        
        /* Modal 彈窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 28px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            color: #ec4899;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 24px;
            margin-top: 8px;
        }
        .token-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        @media (max-width: 1024px) { .token-row { grid-template-columns: 1fr; } .main-grid { grid-template-columns: 1fr; } }
        .token-item { display: flex; flex-direction: column; gap: 12px; }
        .token-status {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .token-status.saved { color: #86efac; }
        .token-status.unsaved { color: #fca5a5; }
        .token-status-indicator { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .token-helper { font-size: 11px; color: #666; }
        .token-helper a { color: #ec4899; text-decoration: none; }
        .token-button {
            padding: 8px 16px;
            background: #ec4899;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .token-button:hover { background: #db2777; transform: translateY(-2px); }
        .token-input-group { display: none; gap: 6px; }
        .token-input-group.active { display: flex !important; }
        .token-input-group input, .token-input-group button {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            border: none;
        }
        .token-input-group input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #e5e5e5;
        }
        .token-input-group input:focus { outline: none; border-color: #ec4899; background: #333; }
        .token-input-group button { background: #ec4899; color: white; cursor: pointer; }
        .token-input-group button:hover { background: #db2777; }
        .main-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 32px; }
        .scan-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 28px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input {
            padding: 10px 14px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #e5e5e5;
            font-size: 14px;
        }
        .form-group input:focus { outline: none; border-color: #ec4899; background: #333; }
        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .submit-button, .clear-button {
            padding: 12px 16px;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .submit-button {
            flex: 1;
            background: #ec4899;
        }
        .submit-button:hover { background: #db2777; transform: translateY(-2px); }
        .clear-button {
            flex: 0.3;
            background: #555;
        }
        .clear-button:hover { background: #666; }
        .error-message {
            background: #3a1a1a;
            border: 1px solid #663333;
            border-radius: 8px;
            padding: 12px;
            color: #fca5a5;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            border-left: 4px solid #dc2626;
        }
        .error-message.active { display: block; }
        .result-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 28px;
        }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; text-align: center; color: #666; }
        .empty-state-icon { font-size: 56px; opacity: 0.4; margin-bottom: 16px; }
        .versions-panel { display: none; }
        .versions-panel.active { display: block; margin-bottom: 24px; }
        .version-card {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }
        .version-card:hover { background: #333; border-color: #ec4899; transform: translateX(4px); }
        .version-name { font-weight: 600; margin-bottom: 6px; color: #ec4899; }
        .version-info { font-size: 12px; color: #888; line-height: 1.4; }
        .version-back-button {
            padding: 10px 16px;
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }
        .version-back-button:hover { background: #333; border-color: #555; }
        .result-container { display: none; }
        .result-container.active { display: block; }
        .album-cover { width: 100%; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8); margin-bottom: 20px; aspect-ratio: 1; object-fit: cover; }
        .album-header { margin-bottom: 20px; border-bottom: 1px solid #2a2a2a; padding-bottom: 16px; }
        .album-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #ffffff; }
        .album-artist { color: #ec4899; font-size: 14px; font-weight: 600; }
        
        .title-box-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: flex-start;
        }
        .title-box {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 14px;
        }
        .title-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; margin-bottom: 6px; }
        .title-textarea {
            width: 100%;
            min-height: 60px;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #e5e5e5;
            padding: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }
        .title-textarea:focus { outline: none; border-color: #ec4899; background: #222; color: #ec4899; }
        .title-counter { font-size: 11px; color: #666; margin-top: 4px; text-align: right; }
        .title-counter.warning { color: #fca5a5; }
        .copy-button {
            padding: 10px 16px;
            background: #ec4899;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            align-self: flex-end;
            margin-top: 28px;
        }
        .copy-button:hover { background: #db2777; }
        .copy-button.copied { background: #10b981; }
        
        .keywords-section {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2a2a2a;
        }
        .keywords-section.hidden { display: none; }
        .keywords-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #ccc; }
        .keywords-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }
        .keyword-button {
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #ccc;
            cursor: pointer;
            font-size: 11px;
            line-height: 1.3;
            transition: all 0.2s ease;
            text-align: center;
            word-break: break-word;
        }
        .keyword-button:hover {
            background: #ec4899;
            border-color: #ec4899;
            color: white;
        }
        
        .info-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
        }
        .info-section.hidden { display: none; }
        .info-block {
            margin-bottom: 12px;
            padding: 10px;
            background: #2a2a2a;
            border-left: 3px solid #ec4899;
            border-radius: 4px;
        }
        .info-block-title { font-size: 11px; font-weight: 700; color: #ec4899; margin-bottom: 6px; text-transform: uppercase; }
        .info-block-content { font-size: 12px; color: #d1d5db; line-height: 1.5; word-break: break-word; }
        
        .loading-indicator {
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            margin-bottom: 20px;
        }
        .loading-indicator.hidden {
            display: none !important;
        }
        .loading-bar {
            width: 100px;
            height: 4px;
            background: #2a2a2a;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .loading-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #ec4899, #a855f7, #ec4899);
            background-size: 200% 100%;
            animation: loading-bar-animation 1.5s ease-in-out infinite;
        }
        @keyframes loading-bar-animation {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
            100% { background-position: 0% 0%; }
        }
        .loading-text {
            font-size: 14px;
            color: #888;
            font-weight: 600;
        }
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255, 255, 255, 0.2); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GrooveRunner</h1>
            <div class="header-subtitle">
                <div>Vinyl Scanner</div>
                <div style="font-size: 11px; color: #666; margin-top: 2px;">Discogs + Gemini</div>
            </div>
            <button class="token-button" onclick="openSettingsModal()" style="margin-left: auto;">⚙️ 設置</button>
        </div>

        <!-- Modal 彈窗 -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeSettingsModal()">✕</button>
                <div class="modal-title">⚙️ 設置</div>
                <div class="token-section active">
                    <div class="token-row">
                <div class="token-item">
                    <div>
                        <div class="token-status unsaved" id="discogsStatus">
                            <span class="token-status-indicator"></span>
                            <span>Discogs Token</span>
                        </div>
                        <div class="token-helper">取得：<a href="https://www.discogs.com/settings/developers" target="_blank">Discogs 開發者</a></div>
                    </div>
                    <button class="token-button" onclick="toggleTokenInput('discogs')">設置</button>
                    <div id="discogsInputGroup" class="token-input-group">
                        <input id="discogsInput" type="password" placeholder="Discogs API Token">
                        <button onclick="saveToken('discogs')">儲存</button>
                    </div>
                </div>

                <div class="token-item">
                    <div>
                        <div class="token-status unsaved" id="geminiStatus">
                            <span class="token-status-indicator"></span>
                            <span>Gemini API Key</span>
                        </div>
                        <div class="token-helper">取得：<a href="https://ai.google.dev/" target="_blank">Google AI Studio</a></div>
                    </div>
                    <button class="token-button" onclick="toggleTokenInput('gemini')">設置</button>
                    <div id="geminiInputGroup" class="token-input-group">
                        <input id="geminiInput" type="password" placeholder="Gemini API Key">
                        <button onclick="saveToken('gemini')">儲存</button>
                    </div>
                </div>

                <div class="token-item">
                    <div>
                        <div class="token-status unsaved" id="storeStatus">
                            <span class="token-status-indicator"></span>
                            <span>店家名稱</span>
                        </div>
                        <div class="token-helper">用於標題前綴</div>
                    </div>
                    <button class="token-button" onclick="toggleTokenInput('store')">設置</button>
                    <div id="storeInputGroup" class="token-input-group">
                        <input id="storeInput" type="text" placeholder="例如：Yahoo拍賣、蝦皮">
                        <button onclick="saveToken('store')">儲存</button>
                    </div>
                </div>
            </div>
        </div>
            <div class="scan-card">
                <div class="form-group">
                    <label>輸入條碼</label>
                    <input id="barcodeInput" type="text" placeholder="例如: 5099950304029" onkeypress="if(event.key==='Enter') searchBarcode()" autocomplete="off">
                </div>
                <div class="button-group">
                    <button class="submit-button" onclick="searchBarcode()">搜尋</button>
                    <button class="clear-button" onclick="clearBarcode()">清空</button>
                </div>

                <div class="form-group">
                    <label>Matrix/Runout Code（非必填）</label>
                    <input id="matrixInput" type="text" placeholder="用於精確識別版本" autocomplete="off">
                </div>

                <div id="errorMessage" class="error-message"></div>
            </div>

            <div class="result-card">
                <div id="emptyState" class="empty-state">
                    <div class="empty-state-icon">🎵</div>
                    <p>輸入條碼以開始</p>
                </div>

                <div id="versionsPanel" class="versions-panel">
                    <button class="version-back-button" onclick="backToVersions()">← 返回搜尋</button>
                    <div id="versionsList"></div>
                </div>

                <div id="resultContainer" class="result-container">
                    <button class="version-back-button" onclick="backToVersions()" id="backBtn" style="display: none;">← 選擇其他版本</button>
                    <img id="albumCover" class="album-cover" alt="專輯封面">
                    
                    <div class="album-header">
                        <div class="album-title" id="albumTitle"></div>
                        <div class="album-artist" id="albumArtist"></div>
                    </div>

                    <div class="title-box-wrapper">
                        <div class="title-box">
                            <div class="title-label">📝 商品標題（60字以內）</div>
                            <textarea id="titleInput" class="title-textarea" placeholder="點擊下方關鍵字或手動輸入標題..."></textarea>
                            <div class="title-counter"><span id="charCount">0</span>/60</div>
                        </div>
                        <button class="copy-button" onclick="copyTitle()">複製</button>
                    </div>

                    <div id="keywordsSection" class="keywords-section hidden">
                        <div class="keywords-title">📌 關鍵字（點擊加入標題）</div>
                        <div id="keywordsGrid" class="keywords-grid"></div>
                    </div>

                    <div id="infoSection" class="info-section hidden">
                        <div id="loadingIndicator" class="loading-indicator hidden">
                            <div class="loading-bar">
                                <div class="loading-bar-inner"></div>
                            </div>
                            <div class="loading-text">I'm loading.....</div>
                        </div>
                        <div id="infoContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DISCOGS_API = 'https://api.discogs.com';
        let discogsToken = localStorage.getItem('discogsToken') || '';
        let geminiKey = localStorage.getItem('geminiKey') || '';
        let storeName = localStorage.getItem('storeName') || '';
        let allVersions = [];

        window.addEventListener('DOMContentLoaded', () => {
            if (discogsToken) updateTokenStatus('discogs');
            if (geminiKey) updateTokenStatus('gemini');
            if (storeName) updateTokenStatus('store');
            
            document.getElementById('titleInput').addEventListener('input', (e) => {
                const count = e.target.value.length;
                const counter = document.getElementById('charCount');
                counter.textContent = count;
                if (count > 60) {
                    counter.parentElement.classList.add('warning');
                } else {
                    counter.parentElement.classList.remove('warning');
                }
            });

            // Modal 外點擊關閉
            document.getElementById('settingsModal').addEventListener('click', (e) => {
                if (e.target.id === 'settingsModal') {
                    closeSettingsModal();
                }
            });
        });

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function toggleTokenInput(type) {
            const group = document.getElementById(type + 'InputGroup');
            group.classList.toggle('active');
            if (group.classList.contains('active')) {
                if (type === 'discogs') document.getElementById(type + 'Input').value = discogsToken;
                else if (type === 'gemini') document.getElementById(type + 'Input').value = geminiKey;
                else if (type === 'store') document.getElementById(type + 'Input').value = storeName;
                document.getElementById(type + 'Input').focus();
            }
        }

        function saveToken(type) {
            const input = document.getElementById(type + 'Input').value.trim();
            if (input) {
                if (type === 'discogs') {
                    discogsToken = input;
                    localStorage.setItem('discogsToken', input);
                } else if (type === 'gemini') {
                    geminiKey = input;
                    localStorage.setItem('geminiKey', input);
                } else if (type === 'store') {
                    storeName = input;
                    localStorage.setItem('storeName', input);
                }
                document.getElementById(type + 'InputGroup').classList.remove('active');
                updateTokenStatus(type);
                alert('已儲存！');
            }
        }

        function updateTokenStatus(type) {
            const statusEl = document.getElementById(type + 'Status');
            let token;
            let label;
            if (type === 'discogs') { token = discogsToken; label = 'Discogs Token ✓'; }
            else if (type === 'gemini') { token = geminiKey; label = 'Gemini API Key ✓'; }
            else if (type === 'store') { token = storeName; label = 'Store ✓'; }
            
            if (token) {
                statusEl.className = 'token-status saved';
                statusEl.innerHTML = '<span class="token-status-indicator"></span><span>' + label + '</span>';
            }
        }

        function clearBarcode() {
            document.getElementById('barcodeInput').value = '';
            document.getElementById('barcodeInput').focus();
        }

        async function searchBarcode(code = null) {
            const barcode = code || document.getElementById('barcodeInput').value.trim();
            
            if (!barcode) {
                showError('請輸入條碼');
                return;
            }

            clearError();
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('versionsPanel').classList.remove('active');
            document.getElementById('resultContainer').classList.remove('active');
            document.getElementById('emptyState').innerHTML = '<div class="empty-state-icon">⏳</div><p><span class="spinner"></span>搜尋中...</p>';
            document.getElementById('emptyState').style.display = 'flex';

            try {
                let url = `${DISCOGS_API}/database/search?barcode=${encodeURIComponent(barcode)}`;
                if (discogsToken) url += `&token=${discogsToken}`;

                const response = await fetch(url, { headers: { 'User-Agent': 'VinylScanner/1.0' } });
                if (!response.ok) throw new Error(`API 錯誤: ${response.status}`);

                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    let cdVersions = [];
                    for (let result of data.results.slice(0, 10)) {
                        let detailUrl = result.resource_url;
                        if (discogsToken) detailUrl += `?token=${discogsToken}`;

                        const detailResponse = await fetch(detailUrl, { headers: { 'User-Agent': 'VinylScanner/1.0' } });
                        if (detailResponse.ok) {
                            const detailData = await detailResponse.json();
                            if (detailData.formats?.some(f => f.name?.includes('CD'))) {
                                cdVersions.push({ data: detailData, result: result, barcode: barcode });
                                if (cdVersions.length >= 5) break;
                            }
                        }
                    }

                    if (cdVersions.length > 0) {
                        allVersions = cdVersions;
                        showVersions();
                    } else {
                        showError('找不到 CD 版本');
                        document.getElementById('emptyState').innerHTML = '<div class="empty-state-icon">🎵</div><p>輸入條碼以開始</p>';
                    }
                } else {
                    showError('找不到該條碼的唱片');
                    document.getElementById('emptyState').innerHTML = '<div class="empty-state-icon">🎵</div><p>輸入條碼以開始</p>';
                }
            } catch (err) {
                showError(`查詢失敗: ${err.message}`);
                document.getElementById('emptyState').innerHTML = '<div class="empty-state-icon">🎵</div><p>輸入條碼以開始</p>';
            }
        }

        function showVersions() {
            const list = document.getElementById('versionsList');
            list.innerHTML = '';
            allVersions.forEach((v, idx) => {
                const matrixCode = v.data.identifiers?.find(id => id.type === 'Matrix / Runout')?.value || '-';
                const sidCode = v.data.identifiers?.find(id => id.type === 'SID Code')?.value || '-';
                const card = document.createElement('div');
                card.className = 'version-card';
                card.innerHTML = `<div class="version-name">${v.data.title}</div><div class="version-info">年份: ${v.data.year || '-'} | 地區: ${v.data.country || '-'}<br>${matrixCode !== '-' ? 'Matrix: ' + matrixCode + ' | ' : ''}${sidCode !== '-' ? 'SID: ' + sidCode : ''}</div>`;
                card.onclick = () => selectVersion(idx);
                list.appendChild(card);
            });
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('versionsPanel').classList.add('active');
        }

        function selectVersion(idx) {
            displayAlbum(allVersions[idx].data);
        }

        function backToVersions() {
            if (allVersions.length > 1) {
                document.getElementById('versionsPanel').classList.add('active');
                document.getElementById('resultContainer').classList.remove('active');
                document.getElementById('backBtn').style.display = 'none';
            }
        }

        async function displayAlbum(albumData) {
            document.getElementById('albumTitle').textContent = albumData.title;
            document.getElementById('albumArtist').textContent = albumData.artists?.map(a => a.name).join(', ') || '未知';

            if (albumData.images?.length > 0) {
                document.getElementById('albumCover').src = albumData.images[0].uri;
                document.getElementById('albumCover').style.display = 'block';
            }

            document.getElementById('titleInput').value = '';
            document.getElementById('charCount').textContent = '0';
            
            document.getElementById('keywordsGrid').innerHTML = '';
            document.getElementById('keywordsSection').classList.add('hidden');
            document.getElementById('infoSection').classList.remove('hidden');
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('infoContent').innerHTML = '';

            await extractKeywordsAndGenerateContent(albumData);

            document.getElementById('versionsPanel').classList.remove('active');
            document.getElementById('resultContainer').classList.add('active');
            if (allVersions.length > 1) document.getElementById('backBtn').style.display = 'block';
        }

        async function extractKeywordsAndGenerateContent(albumData) {
            // 確保加載條至少顯示 1 秒
            const startTime = Date.now();
            
            if (!geminiKey) {
                displayInfoContent(albumData);
                // 最少等 1 秒再隱藏
                const elapsed = Date.now() - startTime;
                if (elapsed < 1000) {
                    await new Promise(resolve => setTimeout(resolve, 1000 - elapsed));
                }
                document.getElementById('loadingIndicator').classList.add('hidden');
                return;
            }

            try {
                const albumInfo = JSON.stringify({
                    title: albumData.title,
                    artists: albumData.artists?.map(a => a.name) || [],
                    genres: albumData.genres || [],
                    labels: albumData.labels?.map(l => l.name) || [],
                    styles: albumData.styles || []
                });

                const prompt = `從以下唱片資訊中提取關鍵字。

唱片資訊：
${albumInfo}

請返回 JSON 格式：
{
  "keywords": [
    {"zh": "中文名", "en": "English Name"},
    ...
  ]
}

【重要】返回的所有中文必須是台灣繁體中文（不要簡體字）

要求：
- 必須包含「歌手名稱」：中文原文或硬翻 + 英文
- 必須包含「專輪名稱」：中文翻譯或硬翻 + 英文
- 可包含廠牌、風格等
- 風格相關關鍵字只留 2-3 個
- 不要包含格式資訊（CD、Vinyl等）
- ⚠️ 所有中文一律使用繁體（不是簡體）

只返回 JSON，不要其他說明。`;

                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + geminiKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (response.ok) {
                    const data = await response.json();
                    const result = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

                    if (result) {
                        try {
                            const jsonMatch = result.match(/\{[\s\S]*\}/);
                            if (jsonMatch) {
                                const keywordsData = JSON.parse(jsonMatch[0]);
                                displayKeywords(keywordsData.keywords || []);
                            }
                        } catch (err) {
                            console.error('JSON 解析失敗');
                        }
                    }
                }
            } catch (err) {
                console.error('提取關鍵字失敗');
            }

            displayInfoContent(albumData);
            document.getElementById('loadingIndicator').classList.add('hidden');
        }

        function displayKeywords(keywords) {
            const grid = document.getElementById('keywordsGrid');
            grid.innerHTML = '';

            // 先加入 Gemini 提取的關鍵字
            if (keywords && keywords.length > 0) {
                keywords.forEach(kw => {
                    const zhBtn = document.createElement('button');
                    zhBtn.className = 'keyword-button';
                    zhBtn.textContent = kw.zh;
                    zhBtn.onclick = () => addKeywordToTitle(kw.zh);
                    grid.appendChild(zhBtn);

                    const enBtn = document.createElement('button');
                    enBtn.className = 'keyword-button';
                    enBtn.textContent = kw.en;
                    enBtn.onclick = () => addKeywordToTitle(kw.en);
                    grid.appendChild(enBtn);
                });
            }

            // 最後加入「有側標」按鈕
            const sideTagBtn = document.createElement('button');
            sideTagBtn.className = 'keyword-button';
            sideTagBtn.textContent = '有側標';
            sideTagBtn.onclick = () => addKeywordToTitle('有側標');
            grid.appendChild(sideTagBtn);

            document.getElementById('keywordsSection').classList.remove('hidden');
        }

        function addKeywordToTitle(keyword) {
            const titleInput = document.getElementById('titleInput');
            let text = titleInput.value;
            let cursorPos = titleInput.selectionStart;
            
            // 如果還沒有店家名稱前綴，先加上
            if (storeName && !text.startsWith(storeName)) {
                const prefix = storeName + ' ';
                text = prefix + text;
                titleInput.value = text;
                // 光標位置也要往後移
                cursorPos = (cursorPos || 0) + prefix.length;
            }
            
            // 在光標位置插入關鍵字
            const beforeCursor = text.substring(0, cursorPos);
            const afterCursor = text.substring(cursorPos);
            
            // 決定是否需要加空格
            const needSpaceBefore = beforeCursor && !beforeCursor.endsWith(' ');
            const spaceBefore = needSpaceBefore ? ' ' : '';
            const spaceAfter = ' ';
            
            const newText = beforeCursor + spaceBefore + keyword + spaceAfter + afterCursor;
            
            if (newText.length <= 60) {
                titleInput.value = newText;
                document.getElementById('charCount').textContent = newText.length;
                
                // 設置光標位置在新插入的關鍵字後面
                const newCursorPos = cursorPos + spaceBefore.length + keyword.length + spaceAfter.length;
                titleInput.setSelectionRange(newCursorPos, newCursorPos);
                titleInput.focus();
            } else {
                alert('超過 60 字限制！');
            }
        }

        function copyTitle() {
            const titleText = document.getElementById('titleInput').value;
            if (!titleText) {
                alert('標題為空！');
                return;
            }
            navigator.clipboard.writeText(titleText).then(() => {
                const btn = event.target;
                btn.textContent = '✓ 已複製';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '複製';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function displayInfoContent(albumData) {
            const infoContent = document.getElementById('infoContent');
            let html = '';

            if (albumData.artists && albumData.artists.length > 0) {
                html += `<div class="info-block">
                    <div class="info-block-title">藝人</div>
                    <div class="info-block-content">${albumData.artists.map(a => a.name).join(', ')}</div>
                </div>`;
            }

            html += `<div class="info-block">
                <div class="info-block-title">專輯名稱</div>
                <div class="info-block-content">${albumData.title}</div>
            </div>`;

            if (albumData.labels && albumData.labels.length > 0) {
                html += `<div class="info-block">
                    <div class="info-block-title">唱片廠牌</div>
                    <div class="info-block-content">${albumData.labels.map(l => l.name).join(', ')}</div>
                </div>`;
                
                const catalogNumbers = albumData.labels.map(l => l.catno).filter(c => c && c !== '-');
                if (catalogNumbers.length > 0) {
                    html += `<div class="info-block">
                        <div class="info-block-title">目錄編號</div>
                        <div class="info-block-content">${catalogNumbers.join(', ')}</div>
                    </div>`;
                }
            }

            if (albumData.year) {
                html += `<div class="info-block">
                    <div class="info-block-title">發行年份</div>
                    <div class="info-block-content">${albumData.year}</div>
                </div>`;
            }

            if (albumData.country) {
                html += `<div class="info-block">
                    <div class="info-block-title">發行地區</div>
                    <div class="info-block-content">${albumData.country}</div>
                </div>`;
            }

            if (albumData.formats && albumData.formats.length > 0) {
                html += `<div class="info-block">
                    <div class="info-block-title">格式</div>
                    <div class="info-block-content">${albumData.formats.map(f => f.name).join(', ')}</div>
                </div>`;
            }

            const matrixCode = albumData.identifiers?.find(id => id.type === 'Matrix / Runout')?.value;
            if (matrixCode) {
                html += `<div class="info-block">
                    <div class="info-block-title">Matrix Code</div>
                    <div class="info-block-content">${matrixCode}</div>
                </div>`;
            }

            const sidCode = albumData.identifiers?.find(id => id.type === 'SID Code')?.value;
            if (sidCode) {
                html += `<div class="info-block">
                    <div class="info-block-title">SID Code</div>
                    <div class="info-block-content">${sidCode}</div>
                </div>`;
            }

            if (albumData.tracklist && albumData.tracklist.length > 0) {
                const tracksList = albumData.tracklist.map(t => `${t.position} ${t.title}${t.duration ? ' (' + t.duration + ')' : ''}`).join('<br>');
                html += `<div class="info-block">
                    <div class="info-block-title">曲目清單</div>
                    <div class="info-block-content">${tracksList}</div>
                </div>`;
            }

            infoContent.innerHTML = html;
            document.getElementById('infoSection').classList.remove('hidden');
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorMessage').classList.add('active');
        }

        function clearError() {
            document.getElementById('errorMessage').classList.remove('active');
        }
    </script>
</body>
</html>

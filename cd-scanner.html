<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 唱片掃描器 | CD Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'PingFang TC', 'Heiti TC', sans-serif;
            background: linear-gradient(135deg, #581c87 0%, #1e40af 50%, #000000 100%);
            min-height: 100vh;
            color: white;
            padding: 16px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
        }
        .header-icon { font-size: 40px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .header h1 {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-subtitle { margin-left: auto; font-size: 12px; color: #9ca3af; }
        .token-section {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(168, 85, 247, 0.1));
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
            backdrop-filter: blur(10px);
        }
        .token-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 1024px) { .token-row { grid-template-columns: 1fr; } .main-grid { grid-template-columns: 1fr; } }
        .token-item { display: flex; flex-direction: column; gap: 12px; }
        .token-status {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .token-status.saved { color: #86efac; }
        .token-status.unsaved { color: #fca5a5; }
        .token-status-indicator { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .token-helper { font-size: 11px; color: #9ca3af; }
        .token-helper a { color: #60a5fa; text-decoration: none; }
        .token-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .token-button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
        .token-input-group { display: none; gap: 6px; }
        .token-input-group.active { display: flex !important; }
        .token-input-group input, .token-input-group button {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            border: none;
        }
        .token-input-group input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: white;
        }
        .token-input-group input:focus { outline: none; border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2); }
        .token-input-group button { background: linear-gradient(135deg, #16a34a, #15803d); color: white; cursor: pointer; }
        .token-input-group button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4); }
        .main-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 32px; }
        .scan-card {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.8), rgba(17, 24, 39, 0.6));
            border: 1px solid rgba(107, 114, 128, 0.3);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(10px);
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #d1d5db; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input {
            padding: 10px 14px;
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(107, 114, 128, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }
        .form-group input:focus { outline: none; border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1); }
        .submit-button {
            padding: 12px 16px;
            background: linear-gradient(135deg, #a855f7, #9333ea);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .submit-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5); }
        .submit-button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-message {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.2), rgba(239, 68, 68, 0.1));
            border: 1px solid rgba(220, 38, 38, 0.5);
            border-radius: 8px;
            padding: 12px;
            color: #fca5a5;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            border-left: 4px solid #dc2626;
        }
        .error-message.active { display: block; }
        .result-card {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.8), rgba(17, 24, 39, 0.6));
            border: 1px solid rgba(107, 114, 128, 0.3);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(10px);
        }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; text-align: center; color: #6b7280; }
        .empty-state-icon { font-size: 56px; opacity: 0.4; margin-bottom: 16px; }
        .versions-panel { display: none; }
        .versions-panel.active { display: block; margin-bottom: 24px; }
        .version-card {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }
        .version-card:hover { background: rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.6); transform: translateX(4px); }
        .version-name { font-weight: 600; margin-bottom: 6px; color: #a855f7; }
        .version-info { font-size: 12px; color: #9ca3af; line-height: 1.4; }
        .version-back-button {
            padding: 10px 16px;
            background: rgba(107, 114, 128, 0.2);
            color: #d1d5db;
            border: 1px solid rgba(107, 114, 128, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }
        .version-back-button:hover { background: rgba(107, 114, 128, 0.3); }
        .result-container { display: none; }
        .result-container.active { display: block; }
        .album-cover { width: 100%; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); margin-bottom: 20px; aspect-ratio: 1; object-fit: cover; }
        .album-header { margin-bottom: 20px; border-bottom: 2px solid rgba(107, 114, 128, 0.2); padding-bottom: 16px; }
        .album-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .album-artist { color: #a855f7; font-size: 14px; font-weight: 600; }
        .album-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 12px; margin-bottom: 20px; }
        .info-item { display: flex; flex-direction: column; gap: 3px; padding: 10px; background: rgba(168, 85, 247, 0.05); border-radius: 6px; border-left: 2px solid #a855f7; }
        .info-label { color: #9ca3af; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; }
        .info-value { font-weight: 600; color: white; }
        
        /* 關鍵字按鈕區域 */
        .keywords-section {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(107, 114, 128, 0.2);
        }
        .keywords-section.hidden { display: none; }
        .keywords-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #d1d5db; }
        .keywords-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }
        .keyword-button {
            padding: 8px 12px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 6px;
            color: #d1d5db;
            cursor: pointer;
            font-size: 11px;
            line-height: 1.3;
            transition: all 0.2s ease;
            text-align: center;
            word-break: break-word;
        }
        .keyword-button:hover {
            background: rgba(168, 85, 247, 0.3);
            border-color: rgba(168, 85, 247, 0.6);
            transform: scale(1.05);
            color: #a855f7;
        }
        
        /* 標題對話框 */
        .title-box {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .title-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; margin-bottom: 6px; }
        .title-textarea {
            width: 100%;
            min-height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 6px;
            color: #d1d5db;
            padding: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s ease;
        }
        .title-textarea:focus { outline: none; border-color: #a855f7; background: rgba(0, 0, 0, 0.5); color: #a855f7; }
        .title-counter {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
            text-align: right;
        }
        .title-counter.warning { color: #fca5a5; }
        
        /* 曲目清單 */
        .tracks-section { margin-top: 20px; padding-top: 16px; border-top: 2px solid rgba(107, 114, 128, 0.2); }
        .tracks-section.hidden { display: none; }
        .tracks-title { font-weight: 700; font-size: 14px; margin-bottom: 10px; color: #d1d5db; }
        .tracks-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; font-size: 12px; }
        .track-item { padding: 8px 10px; background: rgba(107, 114, 128, 0.1); border-radius: 4px; color: #d1d5db; line-height: 1.3; }
        
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🎵</div>
            <h1>唱片掃描器</h1>
            <div class="header-subtitle">
                <div>CD Scanner</div>
                <div style="font-size: 11px; color: #6b7280; margin-top: 2px;">Discogs + Gemini</div>
            </div>
        </div>

        <div class="token-section">
            <div class="token-row">
                <div class="token-item">
                    <div>
                        <div class="token-status unsaved" id="discogsStatus">
                            <span class="token-status-indicator"></span>
                            <span>Discogs Token</span>
                        </div>
                        <div class="token-helper">取得：<a href="https://www.discogs.com/settings/developers" target="_blank">Discogs 開發者</a></div>
                    </div>
                    <button class="token-button" onclick="toggleTokenInput('discogs')">設置</button>
                    <div id="discogsInputGroup" class="token-input-group">
                        <input id="discogsInput" type="password" placeholder="Discogs API Token">
                        <button onclick="saveToken('discogs')">儲存</button>
                    </div>
                </div>

                <div class="token-item">
                    <div>
                        <div class="token-status unsaved" id="geminiStatus">
                            <span class="token-status-indicator"></span>
                            <span>Gemini API Key</span>
                        </div>
                        <div class="token-helper">取得：<a href="https://ai.google.dev/" target="_blank">Google AI Studio</a></div>
                    </div>
                    <button class="token-button" onclick="toggleTokenInput('gemini')">設置</button>
                    <div id="geminiInputGroup" class="token-input-group">
                        <input id="geminiInput" type="password" placeholder="Gemini API Key">
                        <button onclick="saveToken('gemini')">儲存</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <div class="scan-card">
                <div class="form-group">
                    <label>輸入條碼</label>
                    <input id="barcodeInput" type="text" placeholder="例如: 5099950304029" onkeypress="if(event.key==='Enter') searchBarcode()" autocomplete="off">
                </div>
                <button class="submit-button" onclick="searchBarcode()">搜尋</button>

                <div class="form-group">
                    <label>Matrix/Runout Code（非必填）</label>
                    <input id="matrixInput" type="text" placeholder="用於精確識別版本" autocomplete="off">
                </div>

                <div id="errorMessage" class="error-message"></div>
            </div>

            <div class="result-card">
                <div id="emptyState" class="empty-state">
                    <div class="empty-state-icon">🎵</div>
                    <p>輸入條碼以開始</p>
                </div>

                <div id="versionsPanel" class="versions-panel">
                    <button class="version-back-button" onclick="backToVersions()">← 返回搜尋</button>
                    <div id="versionsList"></div>
                </div>

                <div id="resultContainer" class="result-container">
                    <button class="version-back-button" onclick="backToVersions()" id="backBtn" style="display: none;">← 選擇其他版本</button>
                    <img id="albumCover" class="album-cover" alt="專輯封面">
                    
                    <div class="album-header">
                        <div class="album-title" id="albumTitle"></div>
                        <div class="album-artist" id="albumArtist"></div>
                    </div>

                    <div class="album-info">
                        <div class="info-item"><span class="info-label">格式</span><span class="info-value" id="albumFormat">-</span></div>
                        <div class="info-item"><span class="info-label">地區</span><span class="info-value" id="albumRegion">-</span></div>
                        <div class="info-item"><span class="info-label">Matrix Code</span><span class="info-value" id="albumMatrix">-</span></div>
                        <div class="info-item"><span class="info-label">SID Code</span><span class="info-value" id="albumSID">-</span></div>
                    </div>

                    <!-- 關鍵字按鈕區域 -->
                    <div id="keywordsSection" class="keywords-section hidden">
                        <div class="keywords-title">📌 關鍵字（點擊加入標題）</div>
                        <div id="keywordsGrid" class="keywords-grid"></div>
                    </div>

                    <!-- 標題對話框 -->
                    <div class="title-box">
                        <div class="title-label">📝 商品標題（45字以內）</div>
                        <textarea id="titleInput" class="title-textarea" placeholder="點擊上方關鍵字或手動輸入標題..."></textarea>
                        <div class="title-counter"><span id="charCount">0</span>/45</div>
                    </div>

                    <!-- 曲目清單 -->
                    <div id="tracksSection" class="tracks-section hidden">
                        <div class="tracks-title">🎵 曲目清單</div>
                        <div class="tracks-list" id="tracksList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DISCOGS_API = 'https://api.discogs.com';
        let discogsToken = localStorage.getItem('discogsToken') || '';
        let geminiKey = localStorage.getItem('geminiKey') || '';
        let allVersions = [];
        let currentAlbumData = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (discogsToken) updateTokenStatus('discogs');
            if (geminiKey) updateTokenStatus('gemini');
            
            document.getElementById('titleInput').addEventListener('input', (e) => {
                const count = e.target.value.length;
                const counter = document.getElementById('charCount');
                counter.textContent = count;
                if (count > 45) {
                    counter.parentElement.classList.add('warning');
                } else {
                    counter.parentElement.classList.remove('warning');
                }
            });
        });

        function toggleTokenInput(type) {
            const group = document.getElementById(type + 'InputGroup');
            group.classList.toggle('active');
            if (group.classList.contains('active')) {
                document.getElementById(type + 'Input').value = type === 'discogs' ? discogsToken : geminiKey;
                document.getElementById(type + 'Input').focus();
            }
        }

        function saveToken(type) {
            const input = document.getElementById(type + 'Input').value.trim();
            if (input) {
                if (type === 'discogs') {
                    discogsToken = input;
                    localStorage.setItem('discogsToken', input);
                } else {
                    geminiKey = input;
                    localStorage.setItem('geminiKey', input);
                }
                document.getElementById(type + 'InputGroup').classList.remove('active');
                updateTokenStatus(type);
                alert('已儲存！');
            }
        }

        function updateTokenStatus(type) {
            const statusEl = document.getElementById(type + 'Status');
            const token = type === 'discogs' ? discogsToken : geminiKey;
            if (token) {
                statusEl.className = 'token-status saved';
                statusEl.innerHTML = '<span class="token-status-indicator"></span><span>' + (type === 'discogs' ? 'Discogs Token ✓' : 'Gemini API Key ✓') + '</span>';
            }
        }

        async function searchBarcode(code = null) {
            const barcode = code || document.getElementById('barcodeInput').value.trim();
            
            if (!barcode) {
                showError('請輸入條碼');
                return;
            }

            clearError();
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('versionsPanel').classList.remove('active');
            document.getElementById('resultContainer').classList.remove('active');
            document.getElementById('emptyState').innerHTML = '<div class="empty-state-icon">⏳</div><p><span class="spinner"></span>搜尋中...</p>';
            document.getElementById('emptyState').style.display = 'flex';

            try {
                let url = `${DISCOGS_API}/database/search?barcode=${encodeURIComponent(barcode)}`;
                if (discogsToken) url += `&token=${discogsToken}`;

                const response = await fetch(url, { headers: { 'User-Agent': 'VinylScanner/1.0' } });
                if (!response.ok) throw new Error(`API 錯誤: ${response.status}`);

                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    let cdVersions = [];
                    for (let result of data.results.slice(0, 10)) {
                        let detailUrl = result.resource_url;
                        if (discogsToken) detailUrl += `?token=${discogsToken}`;

                        const detailResponse = await fetch(detailUrl, { headers: { 'User-Agent': 'VinylScanner/1.0' } });
                        if (detailResponse.ok) {
                            const detailData = await detailResponse.json();
                            if (detailData.formats?.some(f => f.name?.includes('CD'))) {
                                cdVersions.push({ data: detailData, result: result, barcode: barcode });
                                if (cdVersions.length >= 5) break;
                            }
                        }
                    }

                    if (cdVersions.length > 0) {
                        allVersions = cdVersions;
                        showVersions();
                    } else {
                        showError('找不到 CD 版本');
                        document.getElementById('emptyState').innerHTML = '<div class="empty-state-icon">🎵</div><p>輸入條碼以開始</p>';
                    }
                } else {
                    showError('找不到該條碼的唱片');
                    document.getElementById('emptyState').innerHTML = '<div class="empty-state-icon">🎵</div><p>輸入條碼以開始</p>';
                }
            } catch (err) {
                showError(`查詢失敗: ${err.message}`);
                document.getElementById('emptyState').innerHTML = '<div class="empty-state-icon">🎵</div><p>輸入條碼以開始</p>';
            }
            document.getElementById('barcodeInput').value = '';
        }

        function showVersions() {
            const list = document.getElementById('versionsList');
            list.innerHTML = '';
            allVersions.forEach((v, idx) => {
                const matrixCode = v.data.identifiers?.find(id => id.type === 'Matrix / Runout')?.value || '-';
                const sidCode = v.data.identifiers?.find(id => id.type === 'SID Code')?.value || '-';
                const card = document.createElement('div');
                card.className = 'version-card';
                card.innerHTML = `<div class="version-name">${v.data.title}</div><div class="version-info">年份: ${v.data.year || '-'} | 地區: ${v.data.country || '-'}<br>${matrixCode !== '-' ? 'Matrix: ' + matrixCode + ' | ' : ''}${sidCode !== '-' ? 'SID: ' + sidCode : ''}</div>`;
                card.onclick = () => selectVersion(idx);
                list.appendChild(card);
            });
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('versionsPanel').classList.add('active');
        }

        function selectVersion(idx) {
            displayAlbum(allVersions[idx].data, allVersions[idx].result, allVersions[idx].barcode);
        }

        function backToVersions() {
            if (allVersions.length > 1) {
                document.getElementById('versionsPanel').classList.add('active');
                document.getElementById('resultContainer').classList.remove('active');
                document.getElementById('backBtn').style.display = 'none';
            }
        }

        async function displayAlbum(albumData, result, barcode) {
            currentAlbumData = albumData;
            
            document.getElementById('albumTitle').textContent = albumData.title;
            document.getElementById('albumArtist').textContent = albumData.artists?.map(a => a.name).join(', ') || '未知';
            document.getElementById('albumFormat').textContent = albumData.formats?.map(f => f.name).join(', ') || '-';
            document.getElementById('albumRegion').textContent = albumData.country || '-';
            
            const matrixCode = albumData.identifiers?.find(id => id.type === 'Matrix / Runout')?.value || '-';
            const sidCode = albumData.identifiers?.find(id => id.type === 'SID Code')?.value || '-';
            document.getElementById('albumMatrix').textContent = matrixCode;
            document.getElementById('albumSID').textContent = sidCode;

            if (albumData.images?.length > 0) {
                document.getElementById('albumCover').src = albumData.images[0].uri;
                document.getElementById('albumCover').style.display = 'block';
            }

            if (albumData.tracklist?.length > 0) {
                document.getElementById('tracksList').innerHTML = albumData.tracklist.map(track => `<div class="track-item"><strong>${track.position}</strong> ${track.title}${track.duration ? ' (' + track.duration + ')' : ''}</div>`).join('');
                document.getElementById('tracksSection').classList.remove('hidden');
            }

            document.getElementById('titleInput').value = '';
            document.getElementById('charCount').textContent = '0';
            
            document.getElementById('keywordsGrid').innerHTML = '';
            document.getElementById('keywordsSection').classList.add('hidden');

            await extractKeywords(albumData);

            document.getElementById('versionsPanel').classList.remove('active');
            document.getElementById('resultContainer').classList.add('active');
            if (allVersions.length > 1) document.getElementById('backBtn').style.display = 'block';
        }

        async function extractKeywords(albumData) {
            if (!geminiKey) return;

            try {
                const albumInfo = JSON.stringify({
                    title: albumData.title,
                    artists: albumData.artists?.map(a => a.name) || [],
                    genres: albumData.genres || [],
                    labels: albumData.labels?.map(l => l.name) || [],
                    credits: albumData.credits?.map(c => ({ name: c.name, role: c.role })) || [],
                    styles: albumData.styles || []
                });

                const prompt = `從以下唱片資訊中提取所有相關的關鍵字（藝人、作曲家、指揮家、演奏家、樂團、廠牌、風格等），不要提取格式資訊（CD、Vinyl等）。

每個關鍵字需要包含中文和英文。

唱片資訊：
${albumInfo}

請返回 JSON 格式，每個關鍵字都有 \`zh\` (台灣中文) 和 \`en\` (英文) 兩個字段。
範例格式：
{
  "keywords": [
    {"zh": "大衛·鮑伊", "en": "David Bowie"},
    {"zh": "齊格斯之星", "en": "Ziggy Stardust"},
    {"zh": "RCA唱片", "en": "RCA Records"}
  ]
}

只返回 JSON，不要其他說明。`;

                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + geminiKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) {
                    console.error('❌ Gemini API 錯誤:', response.status);
                    return;
                }

                const data = await response.json();
                const result = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

                if (result) {
                    try {
                        const jsonMatch = result.match(/\{[\s\S]*\}/);
                        if (jsonMatch) {
                            const keywordsData = JSON.parse(jsonMatch[0]);
                            displayKeywords(keywordsData.keywords || []);
                        }
                    } catch (err) {
                        console.error('❌ JSON 解析失敗:', err);
                    }
                }
            } catch (err) {
                console.error('❌ 提取關鍵字失敗:', err);
            }
        }

        function displayKeywords(keywords) {
            const grid = document.getElementById('keywordsGrid');
            grid.innerHTML = '';

            if (!keywords || keywords.length === 0) return;

            keywords.forEach(kw => {
                const zhBtn = document.createElement('button');
                zhBtn.className = 'keyword-button';
                zhBtn.textContent = kw.zh;
                zhBtn.onclick = () => addKeywordToTitle(kw.zh);
                grid.appendChild(zhBtn);

                const enBtn = document.createElement('button');
                enBtn.className = 'keyword-button';
                enBtn.textContent = kw.en;
                enBtn.onclick = () => addKeywordToTitle(kw.en);
                grid.appendChild(enBtn);
            });

            document.getElementById('keywordsSection').classList.remove('hidden');
        }

        function addKeywordToTitle(keyword) {
            const titleInput = document.getElementById('titleInput');
            const currentText = titleInput.value;
            const newText = currentText ? currentText + ' ' + keyword : keyword;
            
            if (newText.length <= 45) {
                titleInput.value = newText;
                document.getElementById('charCount').textContent = newText.length;
            } else {
                alert('超過 45 字限制！');
            }
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorMessage').classList.add('active');
        }

        function clearError() {
            document.getElementById('errorMessage').classList.remove('active');
        }
    </script>
</body>
</html>
